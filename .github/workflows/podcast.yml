name: Podcast episode

on:
  schedule:
    - cron: "0 0,12 * * *" # 2x/day backstop (08:00 and 20:00 SGT)
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder slug under podcast/episodes/ (leave 'auto' to generate from top recent story)"
        required: true
        default: "auto"
      minutes:
        description: "Maximum runtime in minutes (8–120). The writer can shorten thin topics."
        default: "30"
      story:
        description: "TWK story slug. Required for specials over 30 minutes."
      sources:
        description: "Optional supporting TWK story slugs, separated by spaces."
      writer:
        description: "Optional NVIDIA NIM writer (nim:publisher/model)"
      publish:
        description: "Publish the rendered episode"
        type: boolean
        default: false
  repository_dispatch:
    types: [podcast]

permissions:
  contents: read

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  build-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EPISODE: ${{ github.event.inputs.episode || github.event.client_payload.episode || 'auto' }}
      PODCAST_MINUTES: ${{ github.event.inputs.minutes || github.event.client_payload.minutes || '30' }}
      PODCAST_STORY: ${{ github.event.inputs.story || github.event.client_payload.story }}
      PODCAST_SOURCES: ${{ github.event.inputs.sources || github.event.client_payload.sources }}
      PODCAST_WRITER: ${{ github.event.inputs.writer || github.event.client_payload.writer }}
      PODCAST_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
      PODCAST_EXECUTION: github
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TTS_PROVIDER: fish
      FISH_AUDIO_MODEL: ${{ vars.FISH_AUDIO_MODEL || 's2.1-pro-free' }}
      TWK_AUTOMATION_URL: ${{ secrets.TWK_AUTOMATION_URL }}
      AUTOMATION_INGEST_SECRET: ${{ secrets.AUTOMATION_INGEST_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: audio-node-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --onnxruntime-node-install-cuda=skip

      - name: Run unit tests
        run: npm test

      - name: Restore reusable podcast work
        id: podcast-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/podcast
          # Caches are immutable. Each attempt saves a new snapshot; restores use
          # the latest one. The code content-checks each individual entry.
          key: podcast-work-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            podcast-work-v1-${{ runner.os }}-

      - name: Generate podcast episode
        run: |
          args=(--provider fish)
          if [[ "$PODCAST_PUBLISH" == "true" ]]; then
            args+=(--publish)
          else
            args+=(--no-publish)
          fi
          if [[ "$EPISODE" == "auto" ]]; then
            args+=(--auto --minutes "$PODCAST_MINUTES")
            if [[ -n "$PODCAST_STORY" ]]; then args+=(--story "$PODCAST_STORY"); fi
            if [[ -n "$PODCAST_WRITER" ]]; then args+=(--writer "$PODCAST_WRITER"); fi
            read -r -a sources <<< "$PODCAST_SOURCES"
            for source in "${sources[@]}"; do args+=(--source "$source"); done
          else
            args+=(--episode "$EPISODE")
          fi
          node podcast/generate-podcast.mjs "${args[@]}"

      - name: Save reusable podcast work (including failed runs)
        if: always() && steps.podcast-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/podcast
          key: ${{ steps.podcast-cache.outputs.cache-primary-key }}

      - name: Upload episode artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: podcast-${{ env.EPISODE }}-${{ github.run_attempt }}
          path: |
            podcast/episodes/*/script.json
            podcast/episodes/*/draft-progress.json
            podcast/episodes/*/editorial-review.json
            podcast/episodes/*/episode.mp3
            podcast/episodes/*/transcript.json
            podcast/episodes/*/manifest.json
            podcast/episodes/feed.xml
