name: Podcast episode

on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # 4x/day backstop (08:00, 14:00, 20:00, 02:00 SGT)
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder slug under podcast/episodes/ (leave 'auto' to generate from top recent story)"
        required: true
        default: "auto"
      tts_provider:
        description: "TTS provider (fish or kokoro)"
        required: true
        default: "fish"
        type: choice
        options:
          - fish
          - kokoro
  repository_dispatch:
    types: [podcast]

permissions:
  contents: read

concurrency:
  group: podcast-${{ github.event.inputs.episode || github.event.client_payload.episode || 'auto' }}
  cancel-in-progress: false

jobs:
  build-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EPISODE: ${{ github.event.inputs.episode || github.event.client_payload.episode || 'auto' }}
      TTS_PROVIDER: ${{ github.event.inputs.tts_provider || github.event.client_payload.tts_provider || 'fish' }}
      TWK_AUTOMATION_URL: ${{ secrets.TWK_AUTOMATION_URL }}
      AUTOMATION_INGEST_SECRET: ${{ secrets.AUTOMATION_INGEST_SECRET }}
      KOKORO_CACHE_DIR: ${{ github.workspace }}/.cache/models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: audio-node-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Restore Kokoro model (fallback cache)
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: kokoro-82m-v1.0-onnx-fp32

      - name: Generate podcast episode
        run: |
          if [ "$EPISODE" = "auto" ]; then
            node podcast/generate-podcast.mjs --auto --provider "$TTS_PROVIDER"
          else
            node podcast/generate-podcast.mjs --episode "$EPISODE" --provider "$TTS_PROVIDER"
          fi

      - name: Upload episode artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: podcast-${{ env.EPISODE }}
          path: |
            podcast/episodes/*/episode.mp3
            podcast/episodes/*/transcript.json
            podcast/episodes/*/manifest.json
            podcast/episodes/feed.xml
